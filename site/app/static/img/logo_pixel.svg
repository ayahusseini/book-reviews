  <rect x="20" y="40" width="4" height="4" fill="#f0b928"/>
  <rect x="24" y="40" width="20" height="4" fill="#f5edd6"/>
  <rect x="44" y="40" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="40" width="4" height="4" fill="#f5edd6"/>
  <rect x="52" y="40" width="4" height="4" fill="#f0b928"/>
  <rect x="56" y="40" width="28" height="4" fill="#f5edd6"/>
  <rect x="84" y="40" width="4" height="4" fill="#0a1832"/>
  <!-- Row 11: bottom page edge -->
  <rect x="8" y="44" width="36" height="4" fill="#0a1832"/>
  <rect x="44" y="44" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="44" width="40" height="4" fill="#0a1832"/>
  <!-- Row 12: dark blue cover top -->
  <rect x="12" y="48" width="4" height="4" fill="#0a1832"/>
  <rect x="16" y="48" width="28" height="4" fill="#0f2d5c"/>
  <rect x="44" y="48" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="48" width="32" height="4" fill="#0f2d5c"/>
  <rect x="80" y="48" width="4" height="4" fill="#0a1832"/>
  <!-- Row 13: dark blue cover bottom -->
  <rect x="12" y="52" width="4" height="4" fill="#0a1832"/>
  <rect x="16" y="52" width="28" height="4" fill="#0f2d5c"/>
  <rect x="44" y="52" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="52" width="32" height="4" fill="#0f2d5c"/>
  <rect x="80" y="52" width="4" height="4" fill="#0a1832"/>
  <!-- Row 14: cover base outline -->
  <rect x="16" y="56" width="64" height="4" fill="#0a1832"/>
