<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 72" shape-rendering="crispEdges">
  <!-- Pixel art closed book: portrait orientation -->
  <!-- Outline: top, bottom, left, right -->
  <rect x="4" y="0" width="52" height="4" fill="#0a1832"/>
  <rect x="4" y="68" width="52" height="4" fill="#0a1832"/>
  <rect x="4" y="4" width="4" height="64" fill="#0a1832"/>
  <rect x="56" y="4" width="4" height="64" fill="#0a1832"/>
  <!-- Spine highlight (bright edge) -->
  <rect x="8" y="4" width="4" height="64" fill="#f0b928"/>
  <!-- Spine main (orange) -->
  <rect x="12" y="4" width="4" height="64" fill="#e88a1a"/>
  <!-- Cover (dark blue) -->
  <rect x="16" y="4" width="36" height="64" fill="#1a3865"/>
  <!-- Pages visible on right edge (cream) -->
  <rect x="52" y="4" width="4" height="64" fill="#f5edd6"/>
  <!-- Cover: top decoration band -->
  <rect x="18" y="6" width="32" height="4" fill="#2d5f9e"/>
  <!-- Cover: bottom decoration band -->
  <rect x="18" y="62" width="32" height="4" fill="#2d5f9e"/>
  <!-- Cover: title block -->
  <rect x="22" y="18" width="24" height="6" fill="#2d6cbf"/>
  <rect x="22" y="26" width="24" height="4" fill="#2d6cbf"/>
  <!-- Cover: author line (shorter, dimmer) -->
  <rect x="24" y="34" width="18" height="3" fill="#1e4a80"/>
  <!-- Cover: star decoration -->
  <rect x="26" y="44" width="4" height="4" fill="#f0b928"/>
  <rect x="32" y="44" width="4" height="4" fill="#f0b928"/>
  <rect x="38" y="44" width="4" height="4" fill="#f0b928"/>
</svg>
