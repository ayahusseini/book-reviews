  <!-- Row 3: page interior top row -->
  <rect x="8" y="12" width="4" height="4" fill="#0a1832"/>
  <rect x="12" y="12" width="32" height="4" fill="#f5edd6"/>
  <rect x="44" y="12" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="12" width="36" height="4" fill="#f5edd6"/>
  <rect x="84" y="12" width="4" height="4" fill="#0a1832"/>
  <!-- Row 4: stars at col 4 and col 17 -->
  <rect x="8" y="16" width="4" height="4" fill="#0a1832"/>
  <rect x="12" y="16" width="4" height="4" fill="#f5edd6"/>
  <rect x="16" y="16" width="4" height="4" fill="#f0b928"/>
  <rect x="20" y="16" width="24" height="4" fill="#f5edd6"/>
  <rect x="44" y="16" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="16" width="20" height="4" fill="#f5edd6"/>
  <rect x="68" y="16" width="4" height="4" fill="#f0b928"/>
  <rect x="72" y="16" width="12" height="4" fill="#f5edd6"/>
  <rect x="84" y="16" width="4" height="4" fill="#0a1832"/>
  <!-- Row 5: plain -->
  <rect x="8" y="20" width="4" height="4" fill="#0a1832"/>
  <rect x="12" y="20" width="32" height="4" fill="#f5edd6"/>
  <rect x="44" y="20" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="20" width="36" height="4" fill="#f5edd6"/>
  <rect x="84" y="20" width="4" height="4" fill="#0a1832"/>
  <!-- Row 6: stars at col 7 and col 14 -->
  <rect x="8" y="24" width="4" height="4" fill="#0a1832"/>
  <rect x="12" y="24" width="16" height="4" fill="#f5edd6"/>
  <rect x="28" y="24" width="4" height="4" fill="#f0b928"/>
  <rect x="32" y="24" width="12" height="4" fill="#f5edd6"/>
  <rect x="44" y="24" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="24" width="8" height="4" fill="#f5edd6"/>
  <rect x="56" y="24" width="4" height="4" fill="#f0b928"/>
  <rect x="60" y="24" width="24" height="4" fill="#f5edd6"/>
  <rect x="84" y="24" width="4" height="4" fill="#0a1832"/>
  <!-- Row 7: plain -->
  <rect x="8" y="28" width="4" height="4" fill="#0a1832"/>
  <rect x="12" y="28" width="32" height="4" fill="#f5edd6"/>
  <rect x="44" y="28" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="28" width="36" height="4" fill="#f5edd6"/>
  <rect x="84" y="28" width="4" height="4" fill="#0a1832"/>
  <!-- Row 8: stars at col 9 and col 18 -->
