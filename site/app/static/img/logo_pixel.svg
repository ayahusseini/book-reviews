  <rect x="72" y="32" width="4" height="4" fill="#f0b928"/>
  <rect x="76" y="32" width="8" height="4" fill="#f5edd6"/>
  <rect x="84" y="32" width="4" height="4" fill="#0a1832"/>
  <!-- Row 9: plain -->
  <rect x="8" y="36" width="4" height="4" fill="#0a1832"/>
  <rect x="12" y="36" width="32" height="4" fill="#f5edd6"/>
  <rect x="44" y="36" width="4" height="4" fill="#e88a1a"/>
  <rect x="48" y="36" width="36" height="4" fill="#f5edd6"/>
  <rect x="84" y="36" width="4" height="4" fill="#0a1832"/>
  <!-- Row 10: stars at col 5 and col 13 -->
  <rect x="8" y="40" width="4" height="4" fill="#0a1832"/>
