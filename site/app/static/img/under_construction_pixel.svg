<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" shape-rendering="crispEdges">

  <!-- ── Pixel sparkles scattered around ── -->
  <rect x="18" y="20" width="6" height="6" fill="#f0b928"/>
  <rect x="22" y="16" width="6" height="6" fill="#f0b928"/>
  <rect x="18" y="24" width="6" height="6" fill="#0a1832"/>

  <rect x="290" y="18" width="6" height="6" fill="#f0b928"/>
  <rect x="296" y="24" width="6" height="6" fill="#f0b928"/>
  <rect x="290" y="24" width="6" height="6" fill="#0a1832"/>

  <rect x="12" y="190" width="6" height="6" fill="#f0b928"/>
  <rect x="18" y="196" width="6" height="6" fill="#f0b928"/>
  <rect x="12" y="196" width="6" height="6" fill="#0a1832"/>

  <rect x="300" y="192" width="6" height="6" fill="#f0b928"/>
  <rect x="294" y="198" width="6" height="6" fill="#f0b928"/>
  <rect x="300" y="198" width="6" height="6" fill="#0a1832"/>

  <rect x="155" y="10" width="6" height="6" fill="#e88a1a"/>
  <rect x="161" y="10" width="6" height="6" fill="#0a1832"/>
  <rect x="155" y="16" width="6" height="6" fill="#0a1832"/>
  <rect x="161" y="16" width="6" height="6" fill="#e88a1a"/>

  <!-- ── Pixel art hard hat ── -->
  <!-- Brim -->
  <rect x="114" y="42" width="92" height="6" fill="#e88a1a"/>
  <!-- Crown -->
  <rect x="126" y="24" width="68" height="6" fill="#e88a1a"/>
  <rect x="120" y="30" width="80" height="6" fill="#e88a1a"/>
  <rect x="114" y="36" width="92" height="6" fill="#e88a1a"/>
  <!-- Hat outline / shadow -->
  <rect x="126" y="22" width="68" height="2" fill="#0a1832"/>
  <rect x="120" y="28" width="80" height="2" fill="#b86010"/>
  <rect x="114" y="40" width="92" height="2" fill="#b86010"/>
  <!-- Hat highlight -->
  <rect x="130" y="26" width="20" height="4" fill="#ffcc55"/>

  <!-- ── Main sign board ── -->
  <!-- Outer border -->
  <rect x="20" y="58" width="280" height="142" fill="#0a1832"/>
  <!-- Orange frame -->
  <rect x="26" y="64" width="268" height="130" fill="#e88a1a"/>
  <!-- Inner dark blue body -->
  <rect x="34" y="72" width="252" height="114" fill="#0f2d5c"/>
  <!-- Inner accent line -->
  <rect x="38" y="76" width="244" height="106" fill="none" stroke="#f0b928" stroke-width="3"/>

  <!-- ── Sign posts / legs ── -->
  <rect x="60" y="200" width="12" height="34" fill="#e88a1a"/>
  <rect x="60" y="200" width="12" height="3" fill="#b86010"/>
  <rect x="248" y="200" width="12" height="34" fill="#e88a1a"/>
  <rect x="248" y="200" width="12" height="3" fill="#b86010"/>

  <!-- ── Sign text: UNDER ── -->
  <text x="160" y="122"
        font-family="'Courier New', Courier, monospace"
        font-size="28"
        font-weight="900"
        fill="#f5edd6"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="4">UNDER</text>

  <!-- ── Sign text: CONSTRUCTION ── -->
  <text x="160" y="158"
        font-family="'Courier New', Courier, monospace"
        font-size="18"
        font-weight="900"
        fill="#f0b928"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="2">CONSTRUCTION</text>

  <!-- ── Pixel art crossed tools (hammer + wrench) ── -->
  <!-- Left hammer -->
  <rect x="50" y="102" width="6" height="30" fill="#8b7355"/>
  <rect x="44" y="96" width="18" height="12" fill="#6d4c41"/>
  <rect x="44" y="94" width="18" height="4" fill="#5d4037"/>
  <!-- Right wrench -->
  <rect x="264" y="102" width="6" height="30" fill="#8b7355"/>
  <rect x="258" y="96" width="18" height="8" fill="#607d8b"/>
  <rect x="258" y="94" width="8" height="4" fill="#455a64"/>
  <rect x="268" y="94" width="8" height="4" fill="#455a64"/>

</svg>
